<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#27272A" stroke-width="1.5" fill="none"/>

  <!-- AI Detection Bracket Highlights -->
  <path d="M12 22V14H20" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M52 22V14H44" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M12 42V50H20" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <path d="M52 42V50H44" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Stylized Traffic 'Y' - Roadways -->
  <path d="M19 18L32 34L45 18" stroke="#1E1E24" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 34V49" stroke="#1E1E24" stroke-width="9" stroke-linecap="round"/>

  <!-- Glowing Flow Lines (The letter Y) -->
  <path d="M19 18L32 34L45 18" stroke="url(#roadGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 34V49" stroke="#F43F5E" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Highway Lane Center Dashes -->
  <path d="M21 20.5L30 31.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.9"/>
  <path d="M43 20.5L34 31.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.9"/>
  <path d="M32 36V47" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2.5" opacity="0.9"/>

  <!-- Center AI Node (Camera / Target Sensor) -->
  <circle cx="32" cy="34" r="4.5" fill="#F59E0B" filter="url(#glow)"/>
  <circle cx="32" cy="34" r="2" fill="#FFFFFF"/>
</svg>
